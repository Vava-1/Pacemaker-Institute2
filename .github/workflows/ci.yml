name: CI

on:
  push:
    branches: [main, client-ready]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type Check
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Deploy (placeholder)
        if: github.ref == 'refs/heads/main'
        run: echo "Deploy step would go here"
